<app-header title="Create New Legal Notice"></app-header>

<div class="w-section-width h-12  border-b-muted-gray bg-white flex pr-6 pl-6 gap-6">
    <div class="flex items-center w-20 h-12  gap-4 border-slate-gray cursor-pointer" routerLink="/app/home">
        <div class="w-8 h-8 p-1 relative gap-2.5">
            <img src="HomePageHeaderIcon.png" alt="Home" class=" w-6 h-6 absolute top-1 left-1">

        </div>
        <div class="w-11 h-6  ">
            <span class="font-poppins font-normal text-sm leading-relaxed text-charcoal-black">Home</span>
        </div>

        
              
    </div>
     <div class="w-44 h-12 flex justify-center items-center whitespace-nowrap border-b-2 border-b-muted-gray cursor-pointer">
            <span class="font-poppins font-normal text-sm leading-relaxed text-charcoal-black">Create New Legal Notice</span>
        </div>
</div>
<div class="w-full flex flex-col gap-8 mt-6 px-6">


    <div class="w-full h-5 flex items-center justify-center">
      <p class="font-poppins font-medium text-2xl">
        Notice Details
      </p>
    </div>

   <div class="bg-lavender-gray w-full rounded-lg p-4 flex flex-col gap-2.5 pb-8">


     <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 w-full max-w-full">



        <div class="bg-white border border-lavender-gray rounded-lg p-4 flex flex-col gap-3">
          <p class="font-poppins font-medium text-lg text-center">
            From (your client)
          </p>

          <div class="grid grid-cols-2 gap-4">
            <div class="h-16 flex flex-col gap-2">
              <label for="fromFirstName" class="font-poppins font-normal text-base leading-6 text-lightergrey">
                First Name<span>*</span>
              </label>
              <input [(ngModel)]="formData.sender_name" id="fromFirstName" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>

            <div class="h-16 flex flex-col gap-2">
              <label for="fromLastName" class="font-poppins font-normal text-base leading-6 text-lightergrey">
                Last Name<span>*</span>
              </label>
              <input [(ngModel)]="senderLastName" id="fromLastName" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div class="h-nav-items flex flex-col gap-2">
              <label for="fromEmail" class="font-poppins font-normal text-base leading-6 text-lightergrey">Email</label>
              <input [(ngModel)]="formData.sender_email" id="fromEmail" type="email" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>
            <div class="w-full flex flex-col gap-2">
              <label for="fromContact" class="font-poppins font-normal text-base leading-6 text-lightergrey">Contact</label>
              <div class="flex gap-2">
                <select id="fromCountryCode" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900">
                  <option>+91</option>
                </select>
                <input [(ngModel)]="formData.sender_contact" id="fromContact" class="w-full h-10 rounded-md border border-slate-gray px-3 py-2 text-base font-medium font-poppins text-neutral900" />
              </div>
            </div>
          </div>

          <div class="h-nav-items flex flex-col gap-2">
            <label for="fromAddress1" class="font-poppins font-normal text-base leading-6 text-lightergrey">Address (Full)<span>*</span></label>
            <input [(ngModel)]="formData.sender_address" id="fromAddress1" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
          </div>
          
           <div class="h-nav-items flex flex-col gap-2">
            <label for="fromAddress2" class="font-poppins font-normal text-base leading-6 text-lightergrey">Address line 2<span>*</span></label>
            <input id="fromAddress2" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" value="Address line 2" />
          </div>

          <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col gap-2">
              <label for="fromZip" class="font-poppins font-normal text-base text-lightergrey">ZIP code</label>
              <input id="fromZip" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900" value="123456" />
            </div>
            <div class="flex flex-col gap-2">
              <label for="fromCity" class="font-poppins font-normal text-base text-lightergrey">City</label>
              <select id="fromCity" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900"><option>Bengaluru</option></select>
            </div>
            <div class="flex flex-col gap-2">
              <label for="fromState" class="font-poppins font-normal text-base text-lightergrey">State<span>*</span></label>
              <select id="fromState" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900"><option>Karnataka</option></select>
            </div>
          </div>
        </div>

        <div class="bg-white border border-gray-200 rounded-lg p-4 flex flex-col gap-3">
          <p class="font-poppins font-medium text-lg text-center">To</p>
           <div class="grid grid-cols-2 gap-4">
            <div class="h-16 flex flex-col gap-2">
              <label for="fromFirstName" class="font-poppins font-normal text-base leading-6 text-lightergrey">
                First Name<span>*</span>
              </label>
              <input [(ngModel)]="formData.recipient_name" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>

            <div class="h-16 flex flex-col gap-2">
              <label for="fromLastName" class="font-poppins font-normal text-base leading-6 text-lightergrey">
                Last Name<span>*</span>
              </label>
              <input [(ngModel)]="recipientLastName" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>
          </div>

         <div class="grid grid-cols-2 gap-4">
            <div class="h-nav-items flex flex-col gap-2">
              <label for="fromEmail" class="font-poppins font-normal text-base leading-6 text-lightergrey">Email</label>
              <input [(ngModel)]="formData.recipient_email" type="email" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
            </div>
            <div class="w-full flex flex-col gap-2">
              <label for="fromContact" class="font-poppins font-normal text-base leading-6 text-lightergrey">Contact</label>
              <div class="flex gap-2">
                <select id="fromCountryCode" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900">
                  <option>+91</option>
                </select>
                <input [(ngModel)]="formData.recipient_contact" class="w-full h-10 rounded-md border border-slate-gray px-3 py-2 text-base font-medium font-poppins text-neutral900" />
              </div>
            </div>
          </div>

         <div class="h-nav-items flex flex-col gap-2">
           <label for="fromAddress1" class="font-poppins font-normal text-base leading-6 text-lightergrey">Address line 1<span>*</span></label>
           <input [(ngModel)]="formData.recipient_address" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" />
         </div>
         
         <div class="h-nav-items flex flex-col gap-2">
            <label for="fromAddress2" class="font-poppins font-normal text-base leading-6 text-lightergrey">Address line 2<span>*</span></label>
            <input id="fromAddress2" class="h-10 rounded-md border border-slate-gray px-3 py-2 font-poppins font-medium text-base text-neutral900" value="Address line 2" />
          </div>

            <div class="grid grid-cols-3 gap-2">
            <div class="flex flex-col gap-2">
              <label for="fromZip" class="font-poppins font-normal text-base text-lightergrey">ZIP code</label>
              <input id="fromZip" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900" value="123456" />
            </div>
            <div class="flex flex-col gap-2">
              <label for="fromCity" class="font-poppins font-normal text-base text-lightergrey">City</label>
              <select id="fromCity" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900"><option>Bengaluru</option></select>
            </div>
            <div class="flex flex-col gap-2">
              <label for="fromState" class="font-poppins font-normal text-base text-lightergrey">State<span>*</span></label>
              <select id="fromState" class="h-10 w-full rounded-md border border-slate-gray px-3 py-2 text-base font-medium text-neutral900"><option>Karnataka</option></select>
            </div>
          </div>
        </div>
      </div>

    <div class="grid grid-cols-2 gap-6 w-full">

  <div class="flex flex-col gap-2 w-full">
    <label
      for="penalCode"
      class="font-poppins font-normal text-base text-neutral900"
    >
      Penal Code Section / Violation
    </label>

    <div
      class="h-14 rounded-md bg-white 
             flex items-center px-4 gap-2"
    >
      <textarea
        [(ngModel)]="formData.penal_code"
        id="penalCode"
        placeholder=""
        class="flex-1 h-full resize-none 
               text-sm font-poppins border-slate-gray"
      ></textarea>

      <img
        src="/arroww.png"
        alt="arrow"
        class="w-3 h-2 pointer-events-none"
      />
    </div>
  </div>

  <div class="flex flex-col gap-2 w-full">
    <label
      class="font-poppins font-normal text-base text-neutral900"
    >
      Type of Notice
    </label>

    <div
      class="
        h-14
        px-4
        bg-white
        border border-slate-gray
        rounded-md
        cursor-pointer
        grid grid-cols-[1fr_20px]
        items-center
      "
    >
      <input [(ngModel)]="formData.notice_type" class="font-poppins text-base text-neutral900 outline-none w-full" placeholder="e.g. Music Event" />

      
    </div>
  </div>

</div>

<div 
  class="flex flex-col opacity-100
          w-full h-22
           gap-4">
  <label for="shortCase" class="font-poppins font-normal text-base leading-6 text-neutral-900">Short Case Description</label>
      <div class="relative w-full h-24 rounded-sm border border-slate-gray bg-white flex justify-between px-3 py-2">
        <textarea
          id="shortCase"
          name="description"
          [(ngModel)]="formData.description"
          placeholder="Describe the incident, dates, and amounts here..."
          class="w-full h-full outline-none bg-transparent resize-none font-poppins text-sm text-neutral900"
        ></textarea>
        <div class="flex items-start pt-1">
          <img src="/arroww.png" alt="arrow" class="w-3 h-3 opacity-40" />
        </div>
      </div>
    </div>
  </div>
</div>

   <div class="mt-4 px-6">
  <button (click)="generate()" class="w-full h-16 rounded-lg bg-button text-white font-medium mb-2 cursor-pointer" >
 
    Generate Notice
  </button>
</div>
