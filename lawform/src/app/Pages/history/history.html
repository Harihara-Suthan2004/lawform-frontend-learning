<app-header title="History"></app-header>
<!-- title section -->
<div class="w-section-width h-12 border-b border-muted-gray bg-white  pr-6 pl-6 gap-6">
    <div class="flex items-center w-20 h-12 border-b-2 gap-4 border-slate-gray">
        <div class="w-6 h-6 p-1 relative gap-2.5">
            <img src="TimerBlackIcon.png" alt="Home" class=" w-5 h-5 absolute top-1 left-1">

        </div>
        <div class="w-12 h-6 ">
            <span class="font-poppins font-normal text-sm leading-relaxed text-charcoal-black">History</span>
        </div>

    </div>
</div>
<!-- history section -->
<div class="flex flex-col w-section-width h-home-notice-height pt-6 pl-6 pr-4 gap-8 bg-white">
    <div class="w-homenotice-width h-historysection-width rounded-lg  pl-px pr-px pb-2 border border-platinum bg-white">
        <div class="flex justify-between pt-4 pr-6 pb-4 pl-6 w-homenotice-width h-14 rounded-tl-lg rounded-tr-lg">
            <div class="w-16 h-6 gap-1">
                <span
                    class="w-full h-full gap-2 font-poppins font-medium text-xl leading-tight text-dark-gray">History</span>
            </div>
            <!-- search bar -->
            <div class="flex justify-between w-historysearch-width h-8 gap-2.5 rounded-sm text-button">
                <div
                    class="flex items-center justify-between w-historysearch2-width h-8 rounded-sm pt-1.5 pb-1.5 pr-4 pl-4 border border-dark-gray">
                    <div class="flex items-center  w-16 h-4">
                        <input type="text" (keyup)="applyFilter($event)"
                            class="outline-none placeholder-black font-poppins font-normal text-black text-base tracking-wide leading-none"
                            placeholder="Search.." />
                    </div>
                    <button class="flex items-center justify-center w-5 h-5 cursor-pointer">
                        <img src="HistoryPageSearchIcon.png" alt="Search Icon" class=" w-3.5 h-3.5 top-1 left-1">
                    </button>

                </div>
                <div class="flex items-center justify-center w-8 h-8 rounded-sm border p-1 gap-2.5 border-dim-gray">
                    <img src="HistoryPageDownloadIcon.png" alt="Download Icon" class="w-4 h-4">
                </div>


            </div>


        </div>


        <table mat-table [dataSource]="dataSource" class="w-full">
            <ng-container matColumnDef="ClientName" class="">
                <th mat-header-cell *matHeaderCellDef
                    class=" w-72 h-14 pl-6 pr-4 gap-2 bg-bright-gray font-poppins font-semibold text-base">
                    <div class="w-full h-full flex items-center justify-start">
                        <span>Client Name</span>
                            <div class="w-7 h-5 pr-1 pl-1 gap-2.5">
                            <img src="HistoryTableHead1.png" alt="Header arrow" class="w-5 h-5">
                        </div>                    
                    </div>
                </th>
                <td mat-cell *matCellDef="let item"
                    class="w-72 h-14 pl-6 pr-4 font-poppins font-normal leading-2.5 text-base">
                    {{item.ClientName}}
                </td>
            </ng-container>
            <ng-container matColumnDef="Date">
                <th mat-header-cell *matHeaderCellDef
                    class="w-44 h-14 pl-6 pr-4 bg-bright-gray font-poppins font-semibold text-base">
                    <div class="flex items-center justify-center">
                        <span>Date Created</span>
                        <div class="w-7 h-5 pr-1 pl-1 gap-2.5">
                            <img src="HistoryTableHead1.png" alt="Header arrow" class="w-5 h-5">
                        </div>
                        
                    </div>
                </th>
                <td mat-cell *matCellDef="let item" class="flex justify-center items-center h-14 pl-6 pr-4 font-poppins font-normal text-base">
                    {{item.Date}}
                </td>
            </ng-container>
            <ng-container matColumnDef="NoticeTitle">
                <th mat-header-cell *matHeaderCellDef
                    class="w-noticespan2-width h-14 px-4 bg-bright-gray font-poppins font-semibold text-base">
                        Notice Title
                       
                </th>
                <td mat-cell *matCellDef="let item" class="w-noticespan2-width h-full px-4 font-poppins font-normal text-base ">
                    {{item.NoticeTitle}}
                </td>
            </ng-container>
            <ng-container matColumnDef="Status">
                <th mat-header-cell *matHeaderCellDef
                    class="w-44 h-14 pl-4 pr-4 gap-2 bg-bright-gray font-poppins font-semibold text-base">
                    <span class="flex justify-center items-center">Status</span>
                </th>
                <td mat-cell *matCellDef="let item" >
                    <button 
                        class="w-28 h-6 rounded-4xl bg-pale-blue border border-royal-blue pt-1 pr-3 pb-1 pl-3 ml-5 flex items-center justify-center">
                            <span class=" flex items-center justify-center w-24 h-5 font-poppins font-medium text-sm text-royal-blue cursor-pointer" routerLink="/app/downloaded">Downloaded</span>
                        
                    </button>
                </td>
            </ng-container>
            <tr mat-header-row *matHeaderRowDef="displayedColumns" class="h-14"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns" class="h-14"></tr>
            
        </table>
        <mat-paginator #paginator [pageSize]="10" [pageSizeOptions]="[5, 10, 20]" class="hidden"></mat-paginator>

<div class="flex items-center justify-center w-full h-16 px-6 py-4 bg-white  rounded-bl-lg rounded-br-lg gap-4 select-none">
  
  <div class="flex items-center w-56 h-5 px-1.5 gap-1.5">
    <button (click)="paginator.firstPage()" [disabled]="!paginator.hasPreviousPage()" class=" w-5 h-5 p-1 rounded-md disabled:opacity-20 cursor-pointer">
      <img src="paginationBackArrow.png" alt="First" >
    </button>
    
    <button (click)="paginator.previousPage()" [disabled]="!paginator.hasPreviousPage()" class=" w-5 h-5 p-1 rounded-md disabled:opacity-20 cursor-pointer">
      <img src="PaginationBackArrowSmall.png" alt="Prev">
    </button>

      <button (click)="goToPage(0)" 
        [class]="paginator.pageIndex === 0 ? 'bg-black text-white w-5 h-5 rounded-full' : 'w-4 h-4 text-dark-gray'">
        <span class="w-2 h-5">1</span>
      </button>
      
      <button (click)="goToPage(1)" 
        [class]="paginator.pageIndex === 1 ? 'bg-black text-white w-5 h-5 rounded-full' : 'w-4 h-4 text-dark-gray'">
        <span class=" w-2 h-5">2</span>
      </button>

      <span class="flex justify-center items-center w-5 h-5 gap-2.5 text-black">...</span>

      <button (click)="goToPage(5)" 
        [class]="paginator.pageIndex === 5 ? 'bg-black text-white w-4 h-4 rounded-full' : 'w-4 h-4 text-dark-gray'">
        <span class="w-2 h-5">6</span>
      </button>

      <button (click)="goToPage(6)" 
        [class]="paginator.pageIndex === 6 ? 'bg-black text-white w-4 h-4 rounded-full' : 'w-4 h-4 text-dark-gray'">
        <span class="w-2 h-5">7</span>
      </button>
    

    <button (click)="paginator.nextPage()" [disabled]="!paginator.hasNextPage()" class=" p-1 w-5 h-5 rounded-md disabled:opacity-20 cursor-pointer">
      <img src="ForwardArrow2.png" alt="Next" class="">
    </button>
    
    <button (click)="paginator.lastPage()" [disabled]="!paginator.hasNextPage()" class=" w-5 h-5 rounded-md disabled:opacity-20 cursor-pointer">
      <img src="PaginationForwardArrow.png" alt="Last">
    </button>
  </div>

  <div class="flex w-48 h-8 items-center gap-4">
    <span class="flex justify-center items-center font-poppins font-medium text-navy-blue">Lines per page</span>
    
    <div class="flex items-center justify-between border border-platinum rounded-sm px-3 py-1 w-16 h-8">
      <select 
        [ngModel]="paginator.pageSize" 
        (ngModelChange)="paginator.pageSize = $event; dataSource.paginator = paginator"
        class="appearance-none bg-transparent outline-none w-5 h-6 font-inter font-normal text-navy-blue  cursor-pointer">
        <option [value]="5">5</option>
        <option [value]="10">10</option>
        
      </select>
      
      <div class=" w-3 h-7 right-2 flex flex-col pointer-events-none scale-75 text-dim-gray">
        <span class="leading-none font-black text-base">▲</span>
        <span class="leading-none font-black text-base">▼</span>
      </div>
    </div>
  </div>
</div>
    </div>
</div>
