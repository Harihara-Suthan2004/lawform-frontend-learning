<!-- overall -->
<div class="w-section-width h-main-heigth font-poppins flex flex-col ">
    <app-header title="History"></app-header>

    <!-- Navbar -->
    <nav class="h-12 w-section-width  border-b flex gap-6 px-6 bg-white border-b-muted-gray ">
        <ul class="list-none flex h-full gap-6 m-0 p-0">
            <li class="w-20 h-12  py-2 flex items-center gap-1 cursor-pointer " routerLink="/app/history">
                <div class="w-8 h-8 flex  gap-2.5 p-1 ">
                    <div class="w-6 h-6 flex items-center ">
                        <img src="History.png" alt="" class="w-5 h-5 top-1 left-1 ">
                    </div>
                </div>
                <span
                    class="w-12 h-5 font-poppins font-normal text-sm leading-relaxed tracking-normal text-charcoal-black ">History</span>

            </li>
            <li class="w-nav-items h-12  flex items-center gap-4 border-b-2 border-b-slate-gray cursor-pointer ">
                <div class=" h-9  py-2 flex gap-1 items-center ">
                    <span
                        class="w-nav-items h-5 font-poppins font-normal text-sm leading-relaxed tracking-normal text-charcoal-black">{{clientName()}}</span>

                </div>

            </li>
        </ul>
    </nav>

    <main class="w-section-width h-home-notice-height  flex flex-col gap-8 py-8 px-20 bg-white ">
        <div class="w-container-width h-12 flex justify-between items-center  ">
            <!-- arrow -->
            <div class="w-8 h-8 flex items-center cursor-pointer" routerLink="/app/history">

                <img src="Arrow.png" alt="">
            </div>

            <span class="w-notice-heading-width h-12 font-poppins font-medium text-3xl leading-none text-center text-dark-gray flex items-center">Notice from {{clientName()}}</span>
            <div class="w-28 h-6 rounded-full border border-royal-blue flex items-center gap-2 py-1 px-3 bg-pale-blue">
                <span class="w-23 h-5 font-poppins font-medium text-sm leading-5 tracking-tight text-royal-blue cursor-pointer">Downloaded</span>
            </div>
        </div>

        <section class="w-full h-section-height rounded-lg p-4 bg-lavender-gray">
    <div class="w-full h-content-block-height bg-white pt-8 pb-8 px-12 overflow-y-auto scrollbar-custom">

    <p class="w-full block font-poppins font-normal text-base leading-relaxed text-black whitespace-pre-wrap text-justify">
        {{ noticeText() }}
    </p>

</div>
</section>

        <div class=" w-full h-16 rounded-lg flex gap-6  ">
            <button (click)="regenerate()" [disabled]="isRegenerating()"
            class="w-full h-16 rounded-lg border-2 border-steel-blue flex items-center justify-center gap-2 py-4 px-4.5 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed">
    
            <div class="w-6 h-6 flex items-center justify-center">
                <img src="images/Regenerate.png" alt="" [class.animate-spin]="isRegenerating()">
            </div>
    
            <span class="w-40 h-5 font-inter font-semibold text-lg leading-none text-center">
                    {{ isRegenerating() ? 'Processing...' : 'Regenerate Notice' }}
            </span>
        </button>

            <div class="w-full h-16 rounded-lg flex relative overflow-visible z-5">
            <button (click)="downloadAgain()"
                class="w-full h-16 rounded-l-lg border-r-2 border-r-white py-4 px-4.5 bg-button flex gap-4 items-center justify-center cursor-pointer">
                <img src="Download.png" alt="" class="w-4 h-5">
                <span class="min-w-36 w-auto h-5 font-inter font-semibold  text-lg leading-none text-white">
                {{ isNewVersionDraft() ? 'Download Notice' : 'Download Again' }}
            </span>
            </button>

        </div>

    </main>


</div>
