<div class="w-section-width h-main-heigth  flex flex-col  ">
    <app-header title="Create New Legal Notice"></app-header>
    

    <nav class="w-full h-12  flex gap-6 px-6 border-b bg-white border-b-muted-gray ">

        <ul class="list-none flex h-full gap-6 m-0 p-0">

            <li class="w-20 h-12 flex gap-1  py-2 items-center cursor-pointer  "routerLink="/app/home">
                <div class="w-8 h-8 flex gap-2.5 p-1 items-center ">
                    <div class="w-6 h-6  flex items-center justify-center">
                        <img src="Vector2.png" alt="Home" class="w-4 h-5">
                    </div>
                </div>
                <span
                    class="w-10 h-5  font-poppins font-normal text-silver-gray text-sm leading-relaxed tracking-normal">Home</span>

            </li>

            <li class="w-44 h-12 border-b-2 border-b-slate-gray flex gap-1 py-2 items-center cursor-pointer ">

                <span
                    class="w-44 h-5 text-sm font-poppins font-normal leading-6 tracking-normal text-charcoal-black">Create
                    New Legal Notice</span>

            </li>

        </ul>

    </nav>

    <main class="w-section-width h-home-notice-height  pt-8 pb-8 pr-20 pl-20 flex flex-col  gap-8 justify-start">
        <div class="w-container-width h-12  relative flex justify-center items-center">
            <div class="absolute left-0 w-8 h-8  flex items-center justify-center cursor-pointer " routerLink="/app/create-notice">
                <img src="Arrow.png" alt="">
            </div>

            <div class="flex items-center w-section-header-width    h-12">
                <span class="font-poppins font-medium text-3xl leading-none text-center text-dark-gray">Notice Document Preview</span>

            </div>

        </div>

        <section class="w-container-width h-section-height  rounded-lg gap-6 p-4 bg-lavender-gray">
            <div class="w-full h-content-block-height bg-white pt-4 pr-1.5 pb-4 pl-4 flex gap-1.5 overflow-y-auto scrollbar-custom">
                <p class="w-full h-notice-height font-poppins font-normal text-base leading-normal tracking-normal text-black whitespace-pre-wrap">{{ noticeContent() }}</p>

            </div>

        </section>

        <div class=" w-full h-16 rounded-lg flex gap-6  ">
            <button (click)="regenerate()"
                class="w-full h-16 rounded-lg flex items-center justify-center gap-2 py-4 px-4.5 border-2 border-steel-blue cursor-pointer active:bg-slate-100">
                <div class="w-6 h-6  flex items-center justify-center">
                    <img src="Regenerated.png" alt="">
                </div>
                <span
                    class="w-40 h-5 font-inter font-semibold text-[18px] leading-none text-center ">Regenerate
                    Notice</span>
            </button>

            <div class="w-full h-16 rounded-lg  flex relative overflow-visible 45 ">
                <button (click)="downloadPdf()"
                    class="w-full h-full cursor-pointer rounded-l-lg border-r-[1.07px] border-r-white py-4 px-4.5 bg-button flex gap-4 items-center justify-center">
                    <img src="Download.png" alt="" class="w-4 h-5">                                                                     
                    <span class="w-download-button-text h-5 font-inter font-semibold text-lg leading-none text-white">Download Notice</span>
                </button>
