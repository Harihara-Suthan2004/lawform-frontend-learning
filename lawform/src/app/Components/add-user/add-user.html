
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">

    <!-- MODAL BOX - Same size as Create Template modal (w-130) -->
    <div class="w-130 bg-white rounded-lg p-6 shadow-lg">

      <!-- TITLE -->
      <h2 class="mb-4 font-poppins font-medium text-2xl leading-normal tracking-normal">
        Add New User
      </h2>

      <!-- USERNAME INPUT -->
      <label for="username" class="block mb-1 font-poppins text-lightergrey font-normal text-lg leading-normal tracking-normal">
        Username *
      </label>
      <input
        id="username"
        type="text"
        [(ngModel)]="newUser.username"
        name="username"
        placeholder="Enter username"
        class="w-full border rounded px-3 py-2 mb-4 font-poppins"
        [disabled]="isSaving"
      />

      <!-- EMAIL INPUT -->
      <label for="email" class="block mb-1 font-poppins text-lightergrey font-normal text-lg leading-normal tracking-normal">
        Email *
      </label>
      <input
        id="email"
        type="email"
        [(ngModel)]="newUser.email"
        name="email"
        placeholder="Enter email"
        class="w-full border rounded px-3 py-2 mb-4 font-poppins"
        [disabled]="isSaving"
      />

      <!-- PASSWORD INPUT -->
      <label for="password" class="block mb-1 font-poppins text-lightergrey font-normal text-lg leading-normal tracking-normal">
        Password *
      </label>
      <input
        id="password"
        type="password"
        [(ngModel)]="newUser.password"
        name="password"
        placeholder="Enter password (min 6 characters)"
        class="w-full border rounded px-3 py-2 mb-4 font-poppins"
        [disabled]="isSaving"
      />

      <!-- ROLE SELECTION -->
      <label for="role" class="block mb-1 font-poppins text-lightergrey font-normal text-lg leading-normal tracking-normal">
        Role *
      </label>
      <select
        id="role"
        [(ngModel)]="newUser.role"
        name="role"
        class="w-full border rounded px-3 py-2 mb-4 font-poppins"
        [disabled]="isSaving"
      >
        <option value="" disabled selected>Select Role</option>
        <option value="user">User</option>
        <option value="admin">Admin</option>
      </select>

      <!-- ERROR MESSAGE -->
      @if (errorMessage) {
        <div class="bg-red-100 border border-red-400 text-red-700 px-3 py-2 rounded mb-4 text-sm">
          {{ errorMessage }}
        </div>
      }

      <!-- ACTION BUTTONS - Same as Create Template modal -->
      <div class="flex justify-end gap-4">
        <button
          type="button"
          class="text-button font-poppins font-semibold text-base leading-none tracking-normal"
          (click)="closeModal()"
          [disabled]="isSaving"
        >
          Cancel
        </button>

        <button
          type="button"
          (click)="saveUser()"
          [disabled]="isSaving || !newUser.username || !newUser.email || !newUser.password || !newUser.role"
          class="bg-button text-white font-poppins font-semibold text-base leading-normal tracking-normal w-16 h-10 px-3 py-2 gap-0.5 rounded-sm opacity-100 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          {{ isSaving ? 'Save' : 'Save' }}
        </button>
      </div>

    </div>
  </div>
