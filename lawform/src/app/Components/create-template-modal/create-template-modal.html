  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/60">

    <!-- MODAL BOX -->
    <div class="w-130 bg-white rounded-lg p-6 shadow-lg">

      <!-- TITLE -->
      <h2 class="   mb-4 font-poppins font-medium text-2xl leading-normal tracking-normal">
        Create New Template
      </h2>

      <!-- TITLE INPUT -->
      <label for="title" class="block  mb-1 font-poppins text-lightergrey font-normal text-lg leading-normal tracking-normal">
        Title *
      </label>
      <input
        id="title"
        type="text"
        placeholder="Template 1"
        class="w-full border rounded px-3 py-2 mb-4"
      />

      <!-- DESCRIPTION -->
      <label for="description" class="block text-lightergrey mb-1 font-poppins font-normal text-lg leading-normal tracking-normal">
        Description
      </label>
      <textarea
        id="description"
        rows="3"
        placeholder="Jorem ipsum dolor sit amet, caccumsan, risus sem sollicitudin lacus, ut interdum tellus elit sed risus."
        class="w-full border rounded px-3 py-2 mb-4"
      ></textarea>

      <!-- UPLOAD IMAGE -->
      <label for="image" class="block text-lightergrey mb-2 font-poppins font-normal text-lg leading-normal tracking-normal">
        Upload Image *
      </label>
      <input id="image" type="file" hidden />
     <button
  type="button"
  class="flex items-center justify-center
         w-30 h-10
         px-3 py-2 gap-0.5
         rounded-sm
         bg-button text-white
         font-poppins font-semibold text-base
         leading-none tracking-normal
         opacity-100"
  onclick="document.getElementById('image').click()"
>
  Choose File
</button>


      <!-- ACTION BUTTONS -->
      <div class="flex justify-end gap-4">
        <button
          class="text-button font-poppins font-semibold text-base leading-none tracking-normal"
          (click)="closeModal()"
        >
          Cancel
        </button>

        <button
          class="bg-button text-white font-poppins font-semibold text-base leading-normal tracking-normal w-16 h-10 px-3 py-2 gap-0.5 rounded-sm opacity-100"
        >
          Save
        </button>
      </div>

    </div>
  </div>
